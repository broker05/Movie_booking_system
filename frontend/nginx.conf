# -------------------------------------------------------------------
# 1. HTTP Server: Redirect all traffic to HTTPS & Handle ACME Challenge
# -------------------------------------------------------------------
server {
    listen 80;
    server_name rhrony05.me www.rhrony05.me localhost;

    # Allow Let's Encrypt ACME challenge renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------
# 2. HTTPS Server: SSL Termination & Reverse Proxy
# -------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name rhrony05.me www.rhrony05.me localhost;

    # SSL Certificates (Mounted from host /etc/letsencrypt)
    ssl_certificate /etc/letsencrypt/live/rhrony05.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhrony05.me/privkey.pem;

    # Production TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Root folder where static files will be placed
    root /usr/share/nginx/html;
    index index.html;

    # Reverse Proxy: Forward all API requests to the Express backend container
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Routing: Fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) for performance
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }
}

